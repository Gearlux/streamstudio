[flake8]
max-line-length = 120
extend-ignore = E203
exclude = .venv,build,dist
# __init__.py must set the LOGFLOW_COLORIZE env default before importing logflow
# (and the fluxstudio.* submodules that pull it in), so its imports legitimately
# follow a statement — E402 does not apply here.
per-file-ignores =
    fluxstudio/__init__.py: E402
