[flake8]
max-line-length = 120
extend-ignore = E203
exclude = .venv,build,dist
# __init__.py must call logflow.force_no_color() (sets NO_COLOR) before importing
# logflow's get_logger (and the fluxstudio.* submodules that pull it in), so its
# imports legitimately follow a statement — E402 does not apply here.
per-file-ignores =
    fluxstudio/__init__.py: E402
