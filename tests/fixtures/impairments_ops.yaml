# NOTE: ops-export compilation notes:
#   - compiled for export target: node 421 (Taidal_waivefront_op_regions_RegionPowerAnalysisOp)
#   - branching canvas wiring compiled to a sequential op-list — 3 context ops (Save/Use/Mix over per-sample Context cells, freed by their last reader) inserted
impairments_tx_config: !class:waivefront.torchsig.processing.ImpairmentsTxConfig
  quantize: true
  clock_drift: false
  clock_jitter: false
  passband_ripple: true
  iq_imbalance: true
  carrier_phase_noise: false
  carrier_frequency_drift: false
  carrier_phase_offset: false
  intermodulation_products: true
  nonlinear_amplifier: false
  spurs: true
  fading: true
impairments_rx_config: !class:waivefront.torchsig.processing.ImpairmentsRxConfig
  intermodulation_products: false
  nonlinear_amplifier: false
  coarse_gain_change: false
  spurs: false
  iq_imbalance: false
  carrier_phase_noise: false
  carrier_frequency_drift: false
  carrier_phase_offset: false
  passband_ripple: false
  clock_drift: false
  clock_jitter: false
  quantize: false
  digital_agc: false
impairments_tx_config_2: !class:waivefront.torchsig.processing.ImpairmentsTxConfig
  quantize: false
  clock_drift: false
  clock_jitter: false
  passband_ripple: false
  iq_imbalance: false
  carrier_phase_noise: false
  carrier_frequency_drift: false
  carrier_phase_offset: false
  intermodulation_products: false
  nonlinear_amplifier: false
  spurs: false
  fading: false
impairments_rx_config_2: !class:waivefront.torchsig.processing.ImpairmentsRxConfig
  intermodulation_products: true
  nonlinear_amplifier: false
  coarse_gain_change: true
  spurs: true
  iq_imbalance: true
  carrier_phase_noise: false
  carrier_frequency_drift: false
  carrier_phase_offset: false
  passband_ripple: true
  clock_drift: false
  clock_jitter: false
  quantize: false
  digital_agc: true
ops:
- !class:sampleflux.ops.torch.SqueezeOp()
  dim: 0
- !class:waivefront.processing.CropSignalLengthOp()
  length: 10ms
  mode: front
  seed: null
- !class:sampleflux.ops.context.Save()
  name: __taidal_cell_107
- !class:waivefront.spectrogram.SpectrogramOp()
  fft_size: 1024
  hop_size: 512
  spectrogram_type: time_y_bottom
  window: hann
  window_param: null
  periodic: false
  scaling: none
  sample_rate: null
- !class:waivefront.spectrogram.MagnitudeOp()
  eps: 1.0e-12
  to_db: true
  floor_db: null
- !class:sampleflux.ops.configure.ConfigureOp()
  ops:
  - !class:sampleflux.ops.numpy.MaxOp()
    axis: null
    keepdims: false
  - !class:sampleflux.ops.formula.FormulaOp()
    formula: a * 0.2
    var: a
  target: !class:sampleflux.ops.numpy.ThresholdOp()
    high_level: NaN
    low_op: '>'
    high_op: <
  param: low_level
- !class:sampleflux.ops.stash.StashInputOp()
  key: mask
  copy: false
- !class:sampleflux.ops.numpy.ConnectedComponentsOp()
  min_area_bins: 10
  connectivity: 4
- !class:waivefront.spectrogram.BboxesToRegionsOp()
  role: predicted
  label: 5GNR
- !class:sampleflux.ops.context.Save()
  name: __taidal_cell_399
- !class:sampleflux.ops.context.Mix()
  input_from: __taidal_cell_107
  target_from: __taidal_cell_107
  metadata_from: __taidal_cell_399
  drop:
  - __taidal_cell_107
  - __taidal_cell_399
- !class:waivefront.torchsig.processing.ImpairmentsChain()
  probability: 1
  impairment_level: 2
  tx_probability_overrides: null
  rx_probability_overrides: null
  random_state: null
  tx_disabled: !ref 'impairments_tx_config.disabled'
  rx_disabled: !ref 'impairments_rx_config.disabled'
- !class:waivefront.torchsig.processing.NoiseFloorOp()
  noise_power_db: null
  noise_power_db_min: -120.0
  noise_power_db_max: -80.0
  snr_db: null
  snr_db_min: 5.0
  snr_db_max: 40.0
  scale_signal: true
  snr_reference: mask_mean
  fft_size: null
  fft_stride: null
  random_state: null
  window_param: null
  periodic: false
  scaling: power
  band_dynamic_range_db: 50
  mask_key: mask
- !class:waivefront.torchsig.processing.ImpairmentsChain()
  probability: 1
  impairment_level: 1
  tx_probability_overrides: null
  rx_probability_overrides: null
  random_state: null
  tx_disabled: !ref 'impairments_tx_config_2.disabled'
  rx_disabled: !ref 'impairments_rx_config_2.disabled'
- !class:waivefront.spectrogram.SpectrogramOp()
  fft_size: 1024
  hop_size: 512
  spectrogram_type: time_y_bottom
  window: hann
  window_param: null
  periodic: false
  scaling: power
  sample_rate: null
- !class:waivefront.spectrogram.MagnitudeOp()
  eps: 1.0e-12
  to_db: true
  floor_db: null
- !class:waivefront.spectrogram.RegionPowerAnalysisOp()
  regions_key: predicted_regions
  linear: false
