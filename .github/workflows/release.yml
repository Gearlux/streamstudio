# =========================================================================
# HAND-WRITTEN workflow — NOT generated by `aisland jenkins scaffold`.
# (ci.yml / Jenkinsfile are generated; this release pipeline is separate so
# regeneration never clobbers it.)
#
# Publishes the `streamstudio` distribution to PyPI when a version tag is pushed:
#
#   git tag v0.1.0a1 && git push origin v0.1.0a1
#
# Uses PyPI Trusted Publishing (OIDC, no stored API token). One-time setup on
# https://pypi.org/manage/account/publishing/ — add a "pending publisher":
#   PyPI project name: streamstudio
#   Owner:             Gearlux
#   Repository:        streamstudio
#   Workflow name:     release.yml
#   Environment:       pypi
#
# Publish ORDER: this package sits at the end of the chain. It declares floors on
# loggair, confluid, liquifai and the data engine, so every one of those must be on
# PyPI first; nothing in the workspace declares a floor on this one.
# =========================================================================
name: Release to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build & verify distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install packaging toolchain
      run: python -m pip install build twine
    - name: Guard - tag matches pyproject version
      run: |
        PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
          echo "::error::Tag v$TAG_VERSION does not match pyproject version $PKG_VERSION"
          exit 1
        fi
    - name: Build sdist + wheel
      run: python -m build
    - name: Check package metadata
      run: python -m twine check --strict dist/*
    - name: Smoke-test the built wheel in a clean venv
      # Runs from /tmp: with the repo root as cwd, `import streamstudio` would find
      # the SOURCE tree (cwd shadows site-packages) and silently test the repo
      # instead of the wheel. This is the package-shadowing trap the workspace
      # mandates warn about — the repo directory and the package share a name.
      run: |
        python -m venv /tmp/smoke
        /tmp/smoke/bin/pip install --quiet dist/*.whl
        cd /tmp
        /tmp/smoke/bin/python - <<'EOF'
        import os
        import tempfile
        from importlib.metadata import version
        from pathlib import Path

        import streamstudio
        import streamstudio.app

        installed = Path(streamstudio.__file__).parent

        # The editor's page is committed BUILT inside the package (streamstudio/canvas) and must ship: without it `/`
        # answers "The canvas page is not built" on every install. Its record of the source it was built from ships
        # with it; a source map never does.
        canvas = installed.resolve() / "canvas"
        assert streamstudio.app.web_dist() == canvas, (streamstudio.app.web_dist(), canvas)
        assert (canvas / "index.html").exists(), f"no editor page in {canvas}"
        assert list((canvas / "assets").glob("*.js")) and list((canvas / "assets").glob("*.css")), f"no page assets in {canvas}"
        assert (canvas / ".built-from").exists(), "the editor page's build record is missing from the wheel"
        assert not list(canvas.rglob("*.map")), "a source map shipped in the wheel"
        assert (installed / "py.typed").exists(), "py.typed missing from the wheel"

        # The editor itself, served from the wheel over a folder holding one graph: the page, the graph list and the
        # graph's model — the whole install path a user takes, without binding a port.
        folder = Path(tempfile.mkdtemp())
        (folder / "demo.yaml").write_text("stream: !class:recordstream.Stream {}\n")
        client = streamstudio.app.create_app(folder).test_client()
        page = client.get("/")
        assert page.status_code == 200 and b"<!doctype html>" in page.data.lower(), page.status_code
        graphs = client.get("/api/graphs").get_json()
        assert [graph["name"] for graph in graphs] == ["demo"], graphs
        demo = client.get("/api/graphs/demo")
        assert demo.status_code == 200 and demo.get_json()["model"]["nodes"], demo.get_json()

        # `__version__` is the RELEASED number: read from the wheel's own metadata, which the tag guard above matched
        # to pyproject.toml. Missing or typed-in-and-stale fails here, before anything reaches PyPI.
        tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
        assert streamstudio.__version__ == version("streamstudio") == tag, (streamstudio.__version__, version("streamstudio"), tag)
        print(f"wheel smoke-test OK, version: {version('streamstudio')}, graphs: {graphs}")
        EOF
        # The console script is the documented entry point; --help renders every command's options without serving.
        /tmp/smoke/bin/streamstudio --help > /dev/null
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
