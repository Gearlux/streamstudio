[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxstudio"
version = "0.1.0"
description = "Node-based visual editor and step-debugger for DataFlux pipelines."
authors = [{name = "Taidal"}]
license = {text = "MIT"}
dependencies = [
    "liquifai>=0.1.0",
    "log-flow>=0.1.0",
    "confluid>=0.1.0",
    "data-flux>=0.1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "websockets>=12",
    "Pillow>=10",
    "numpy",
    "PyYAML",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "flake8>=6.0.0,<8.0.0",
    "mypy>=1.0.0,<2.0.0",
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
waivefront = ["waivefront"]

[project.scripts]
fluxstudio = "fluxstudio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fluxstudio*"]

[tool.setuptools.package-data]
fluxstudio = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["fluxstudio"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203"]

[tool.mypy]
disable_error_code = ["import-untyped"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
strict_optional = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "uvicorn.*",
    "websockets.*",
    "starlette.*",
    "waivefront.*",
    "PIL.*",
    "torch.*",
    "yaml.*",
]
ignore_missing_imports = true
