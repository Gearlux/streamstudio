[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxstudio"
version = "0.2.0"
description = "Auto-generating ComfyUI nodes from DataFlux/HuggingFace operations."
authors = [{name = "Taidal"}]
license = {text = "MIT"}
dependencies = [
    "liquifai>=0.1.0",
    "log-flow>=0.1.0",
    "confluid>=0.1.0",
    "data-flux>=0.1.0",
    "datasets",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "flake8>=6.0.0,<8.0.0",
    "mypy>=1.0.0,<2.0.0",
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
]
waivefront = ["waivefront"]

[project.scripts]
fluxstudio = "fluxstudio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fluxstudio*"]

[tool.setuptools.package-data]
fluxstudio = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120
