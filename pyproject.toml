[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamstudio"
version = "0.2.0"
description = "Auto-generating ComfyUI nodes from RecordStream/HuggingFace operations."
authors = [{name = "Taidal"}]
license = {text = "MIT"}
dependencies = [
    "liquifai>=0.1.0",
    "loggair>=0.1.0",
    # [pydantic] extra: bridge.py enumerates fields via confluid.to_pydantic.
    "confluid[pydantic]>=0.1.0",
    "recordstream>=0.1.0",
    "datasets",
    # PEP-593 range marks: the bridge reads Annotated[..., Interval/Ge/Le] into widget
    # min/max. Already transitive via confluid[pydantic]->pydantic; declared because
    # bridge.py imports it directly.
    "annotated-types",
    # Shell completion for the argparse CLI (cli.py calls argcomplete.autocomplete).
    # StreamStudio is not a `liquifai.apps` entry point and is not a click app, so
    # neither of the workspace's other two completion paths applies. Declared rather
    # than leaned on transitively (it currently arrives via fiftyone, which is not a
    # dependency of this package); the import in cli.py stays guarded regardless.
    "argcomplete>=3.0",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "flake8>=6.0.0,<8.0.0",
    "mypy>=1.0.0,<2.0.0",
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
]
waivefront = ["waivefront"]

[project.scripts]
streamstudio = "streamstudio.cli:main"

# Custom-node repos the launcher installs into ComfyUI's custom_nodes/ on every launch
# ("generally available" — no flags or env vars needed). ANY installed package may declare
# this group; the target must resolve to a git-URL str or an iterable of them. streamstudio's
# own declaration bundles ComfyUI-Manager (see streamstudio/custom_nodes.py). NOTE: editable
# installs freeze entry-point metadata — after adding/renaming an entry point here, reinstall
# (`uv pip install -e ./streamstudio`); editing the URL tuple in custom_nodes.py needs no reinstall.
[project.entry-points."streamstudio.custom_nodes"]
streamstudio = "streamstudio.custom_nodes:CUSTOM_NODE_URLS"

[tool.setuptools.packages.find]
where = ["."]
include = ["streamstudio*"]

[tool.setuptools.package-data]
# Ship the default palette config (the fallback used when the user has no own config) + the py.typed
# marker. `config.default.yaml` is read at runtime by streamstudio.bridge.
streamstudio = ["py.typed", "config.default.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120
