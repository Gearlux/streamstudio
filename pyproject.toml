[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamstudio"
version = "0.1.0a2"
description = "A graph editor for recordstream pipelines written as confluid YAML."
readme = "README.md"
authors = [{ name = "Gert Behiels" }]
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics :: Editors",
    "Typing :: Typed",
]
# Floors are what the suite runs against in a clean venv resolving from PyPI alone, and each release
# raises every workspace floor to the newest release (user choice 2026-11-26). Measured 2026-11-27 at
# confluid 0.5.0, liquifai 0.4.0, loggair 0.3.0, recordstream 0.1.0a4 and portail 0.1.0a1:
# the suite passed (1351, 5 skipped).
dependencies = [
    # 0.3.0 is the floor for `strict_flags=True` (cli.py) and the declared `short=`
    # options every command carries — both absent from 0.2.0, and both used at MODULE
    # level, so an older liquifai is not a degraded CLI but an ImportError-equivalent:
    # `LiquifyApp.__init__() got an unexpected keyword argument 'strict_flags'` at
    # import, taking every entry point with it (measured 2026-09-03 against 0.2.0).
    "liquifai>=0.4.0",
    "loggair>=0.3.0",
    # [pydantic] extra: palette.py enumerates a class's fields via confluid.to_pydantic.
    # The editor also needs `confluid.load(path, texts=)` (confluid 0.4.0) for EVERY graph: document.py
    # hands confluid the graph's path and every text it holds instead of writing them to disk.
    "confluid[pydantic]>=0.5.0",
    # The pre-release segment is REQUIRED, not cosmetic: under PEP 440 a plain `>=0.1.0`
    # excludes every pre-release of 0.1.0, so it would refuse the only recordstream that
    # exists and resolve to nothing. 0.1.0a2 is the first release carrying the op-chain
    # contract this package imports (RecordContract, check_chain, ChainContractError).
    "recordstream>=0.1.0a4",
    # Imported lazily by the HuggingFace pickers (streamstudio/__init__.py: a dataset's columns and splits).
    "datasets",
    # The standalone server: serving, `stop` / `restart` / `list` by the server's identity (cli.py).
    "portail>=0.1.0a1",
    # Imported at MODULE scope by document.py / _yamltext.py: the document model composes the YAML
    # text with PyYAML's own node tree (yaml.compose) to locate the line a marker came from, and
    # spells patched values with yaml.safe_dump. Already transitive via confluid; declared because
    # a module-scope import is a hard dependency whatever else happens to install it.
    "pyyaml",
    # Imported at MODULE scope by app.py: the graph editor is a Flask blueprint (mounted by a consuming
    # Flask app, or served standalone by bare `streamstudio`) — docs/rewrite.md.
    "flask",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    # Release tooling: `python -m build` produces the sdist + wheel, `twine check`
    # validates the metadata PyPI will re-validate on upload.
    "build>=1.0.0",
    "twine>=5.0.0",
    # The build backend itself (= [build-system] requires): tests/test_packaging.py builds the wheel
    # with `python -m build --wheel --no-isolation` to prove the committed editor page ships in it —
    # no isolation, because an isolated build fetches these from the network, which tests never touch.
    "setuptools>=77",
    "wheel",
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "flake8>=6.0.0,<8.0.0",
    "mypy>=1.0.0,<2.0.0",
    # Type stubs for a DECLARED dependency that ships none (pyyaml). This project's own CI
    # runs `mypy .` from the project directory with the default error codes, so without them every
    # `import yaml` is an `import-untyped` error there (the workspace-root run hides
    # it by disabling that code).
    "types-PyYAML>=6.0.0",
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
]

[project.urls]
Homepage = "https://github.com/Gearlux/streamstudio"
Repository = "https://github.com/Gearlux/streamstudio.git"
Issues = "https://github.com/Gearlux/streamstudio/issues"
Changelog = "https://github.com/Gearlux/streamstudio/blob/main/CHANGELOG.md"

[project.scripts]
streamstudio = "streamstudio.cli:main"

# Liquifai app registration: lets `liquifai-install-completions` discover this CLI via an
# entry-point metadata read instead of executing the binary. Name = the binary name;
# value = the LiquifyApp instance. Entry-point changes need an editable reinstall.
[project.entry-points."liquifai.apps"]
streamstudio = "streamstudio.cli:app"

# `node`/`npm` are for EDITING the canvas page: the built page is committed inside the package
# (`streamstudio/canvas`, carried by package-data below), so a checkout and every install serve it without
# Node. When the page's source (`frontend/`) changed since its committed build, a server's START rebuilds it
# (`streamstudio.page.ensure_page_built`: `npm ci` when its libraries are missing, then `npm run build:page`
# -> `streamstudio/canvas`) — and that rebuilt folder is committed with the source change. Without Node such a
# start still starts, and it and the page at `/` say "the editor's page is out of date and Node is not
# installed — run aisland setup". macOS: brew's `node` formula bundles npm; Linux: aisland fetches the
# official Node LTS tarball into aisland/tools/ (its USERSPACE_TOOLS registry) and symlinks node/npm/npx
# into aisland/bin/ — no sudo; `source project.bashrc` puts aisland/bin on PATH, which is where a start
# looks for them.
[tool.aisland.sys-dependencies]
brew      = ["node"]
userspace = ["node"]

[tool.setuptools.packages.find]
where = ["."]
include = ["streamstudio*"]

[tool.setuptools.package-data]
# `canvas/` is the editor's BUILT page (vite's output, committed; it has no __init__.py, so packages.find skips it
# and this is the ONLY thing that puts it in the wheel — omitted, the package installs and serves no page), served at
# `/` by streamstudio.app.web_dist(): its index.html, the js/css bundles, and `.built-from`, the record of the source
# it was built from (streamstudio.page.STAMP). Source maps are never built or shipped (`*.map` matches none of these
# patterns; tests/test_packaging.py). `py.typed` marks the package as typed.
streamstudio = [
    "py.typed",
    "canvas/index.html",
    "canvas/.built-from",
    "canvas/assets/*.js",
    "canvas/assets/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The fast run (plain `pytest`) stays within 5 minutes; `aisland tests report streamstudio` picks the tests that move
# to the slow run (`pytest -m slow`, CI's slow leg) — never-failed and slowest first.
addopts = "-m 'not slow'"
markers = ["slow: never failed and among the slowest; left out of the fast run, run by CI's slow leg"]

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120

# This project is type-checked TWICE with different configs. From the workspace root the shared
# `mypy.ini` supplies these ignores, so a gap here is invisible there; this project's OWN CI runs
# `mypy .` from the project directory, reads only the tables below, and is what a published package
# must satisfy. Every third party that CI cannot resolve therefore needs an entry HERE, each one for
# a stated reason — never a global `ignore_missing_imports`, never a disabled error code.

# Declared dependency that ships neither a `py.typed` marker nor a stub package.
[[tool.mypy.overrides]]
module = ["datasets.*"]
ignore_missing_imports = true
