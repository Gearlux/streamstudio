[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxstudio"
version = "0.2.0"
description = "Auto-generating ComfyUI nodes from DataFlux/HuggingFace operations."
authors = [{name = "Taidal"}]
license = {text = "MIT"}
dependencies = [
    "liquifai>=0.1.0",
    "logflow-ml>=0.2.0",
    "confluid>=0.1.0",
    "data-flux>=0.1.0",
    "datasets",
    # PEP-593 range marks: the bridge reads Annotated[..., Interval/Ge/Le] into widget
    # min/max. Already transitive via confluid->pydantic; declared because bridge.py
    # imports it directly.
    "annotated-types",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "flake8>=6.0.0,<8.0.0",
    "mypy>=1.0.0,<2.0.0",
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
]
waivefront = ["waivefront"]

[project.scripts]
fluxstudio = "fluxstudio.cli:main"

# Custom-node repos the launcher installs into ComfyUI's custom_nodes/ on every launch
# ("generally available" — no flags or env vars needed). ANY installed package may declare
# this group; the target must resolve to a git-URL str or an iterable of them. fluxstudio's
# own declaration bundles ComfyUI-Manager (see fluxstudio/custom_nodes.py). NOTE: editable
# installs freeze entry-point metadata — after adding/renaming an entry point here, reinstall
# (`uv pip install -e ./fluxstudio`); editing the URL tuple in custom_nodes.py needs no reinstall.
[project.entry-points."fluxstudio.custom_nodes"]
fluxstudio = "fluxstudio.custom_nodes:CUSTOM_NODE_URLS"

[tool.setuptools.packages.find]
where = ["."]
include = ["fluxstudio*"]

[tool.setuptools.package-data]
# Ship the default palette config (the fallback used when the user has no own config) + the py.typed
# marker. `config.default.yaml` is read at runtime by fluxstudio.bridge.
fluxstudio = ["py.typed", "config.default.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120
