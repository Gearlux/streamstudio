# A tiny three-op pipeline used by FluxStudio's tests, headless examples, and
# CI's `Verify Examples` stage.
#
# Source: NumericArraySource yields 4 deterministic float32 arrays in [0, 255].
# Ops:
#   1. RescaleOp(in_min=0, in_max=255) — normalises into [0, 1].
#   2. StandardizeOp(mean=0.5, std=0.5) — shifts to mean 0, scale 1.
#
# Exercised by:
#   - examples/02_step_pipeline.py  (headless stepping, NDJSON to stdout)
#   - tests/test_graph.py           (Graph ⇄ YAML round-trip)
#   - tests/test_api.py             (POST /api/run + WebSocket replay)

!class:dataflux.core.Flux()
source: !class:fluxstudio._fixtures.NumericArraySource()
  count: 4
  size: 8
ops:
  - !class:dataflux.ops.numpy.RescaleOp()
    in_min: 0.0
    in_max: 255.0
    out_min: 0.0
    out_max: 1.0
  - !class:dataflux.ops.numpy.StandardizeOp()
    mean: 0.5
    std: 0.5
